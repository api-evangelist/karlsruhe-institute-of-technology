aid: karlsruhe-institute-of-technology
name: Karlsruhe Institute of Technology Domain Standard Conformance
description: >-
  Conformance of KIT's institution-operated surfaces against the Kin Score `education` regulatory
  regime standards[]. Reward-only: a standard appears here only when it was confirmed against a live
  endpoint or against an explicit declaration inside a machine-readable document KIT itself serves.
  Standards in the regime with no evidence are listed under `not_evidenced` and are deliberately NOT
  claimed. A prose mention on a web page is not conformance.
  This file was generated by API Evangelist from live HTTP probes; it is NOT published by
  the institution and must not be credited to KIT as an artifact of its own.
regime: education
generated: '2026-09-01'
method: probed
source: >-
  Live probes of dbkit.bibliothek.kit.edu, katalog.bibliothek.kit.edu, idp.scc.kit.edu,
  oidc.scc.kit.edu, api.datacite.org and api.crossref.org, 2026-09-01.

conformance:

  - standard: oai-pmh
    status: conformant
    x-operator: institution
    detail: >-
      KITopen, KIT's central open-access institutional repository operated by the KIT Library on its
      own dbkit framework, exposes a fully functional OAI-PMH 2.0 interface on KIT's own registrable
      domain. verb=Identify returns repositoryName "KITopen", protocolVersion 2.0, granularity
      YYYY-MM-DDThh:mm:ssZ, deletedRecord "transient", earliestDatestamp 1999-01-27T00:00:00Z,
      adminEmail dbkit@bibliothek.kit.edu and oai-identifier repositoryIdentifier
      EVASTAR-Karlsruhe.de. verb=ListMetadataFormats advertises three prefixes and verb=ListSets
      serves a working set hierarchy. Confirmed by protocol response, not by link presence.
    evidence:
      - url: https://dbkit.bibliothek.kit.edu/oai/?verb=Identify
        status: 200
        locator: OAI-PMH/Identify/repositoryName = "KITopen"; protocolVersion = 2.0; repositoryIdentifier = EVASTAR-Karlsruhe.de
      - url: https://dbkit.bibliothek.kit.edu/oai/?verb=ListMetadataFormats
        status: 200
        locator: 'metadataPrefix: oai_dc, epicur, oai_datacite'
      - url: https://dbkit.bibliothek.kit.edu/oai/?verb=ListSets
        status: 200
        locator: 'setSpec: open_access, openaire, openaire_data, dnb:dissertations, doc-type:*'
    generated: '2026-09-01'
    method: probed

  - standard: saml
    status: conformant
    x-operator: institution
    detail: >-
      The Scientific Computing Center publishes SAML 2.0 metadata as application/xml from KIT's own
      host. The EntityDescriptor carries entityID https://idp.scc.kit.edu/idp/shibboleth, an
      IDPSSODescriptor and an AttributeAuthorityDescriptor with protocolSupportEnumeration
      urn:oasis:names:tc:SAML:2.0:protocol, four SingleSignOnService bindings (HTTP-Redirect,
      HTTP-POST, HTTP-POST-SimpleSign, SOAP/ECP), and mdui:DisplayName "Karlsruhe Institute of
      Technology (KIT)". Recorded honestly: the self-served copy of this metadata is NOT XML-DSig
      signed; the signed copy is the DFN-AAI aggregate.
    evidence:
      - url: https://idp.scc.kit.edu/idp/shibboleth
        status: 200
        locator: 'EntityDescriptor entityID="https://idp.scc.kit.edu/idp/shibboleth"; protocolSupportEnumeration="urn:oasis:names:tc:SAML:2.0:protocol"; 4 SingleSignOnService bindings'
    generated: '2026-09-01'
    method: probed

  - standard: shibboleth
    status: conformant
    x-operator: institution
    detail: >-
      Two independent confirmations. (1) The SAML metadata above is served from a Shibboleth
      Identity Provider at the conventional /idp/shibboleth path, with SingleSignOnService
      locations under /idp/profile/SAML2/*. (2) The metadata's mdrpi:RegistrationInfo names
      registrationAuthority https://www.aai.dfn.de with registrationInstant 2010-03-15T10:30:11Z,
      and mdattr:EntityAttributes carries entity-category
      http://aai.dfn.de/category/bwidm-member — KIT is a registered participant in the German
      national research-and-education identity federation DFN-AAI and in bwIDM.
    evidence:
      - url: https://idp.scc.kit.edu/idp/shibboleth
        status: 200
        locator: SingleSignOnService Location https://idp.scc.kit.edu/idp/profile/SAML2/Redirect/SSO
      - url: https://idp.scc.kit.edu/idp/shibboleth
        status: 200
        locator: 'mdrpi:RegistrationInfo registrationAuthority="https://www.aai.dfn.de"; entity-category http://aai.dfn.de/category/bwidm-member'
      - url: https://idp.scc.kit.edu/.well-known/openid-configuration
        status: 200
        locator: Shibboleth IdP OIDC plugin discovery, issuer https://idp.scc.kit.edu, jwks_uri /idp/profile/oidc/keyset
    generated: '2026-09-01'
    method: probed

  - standard: datacite
    status: conformant
    x-operator: institution
    detail: >-
      KIT is a DataCite member in its own right, not through a consortium proxy, and the DataCite
      metadata schema is declared inside a contract KIT itself serves. DataCite's own API returns
      provider id "kit", symbol KIT, name "Karlsruhe Institute of Technology",
      memberType direct_member, country DE, rorId https://ror.org/04t3en479, created 2020-12-15.
      Repository client TIB.KIT4RADAR named "RADAR4KIT" resolves to https://radar.kit.edu/. Beyond
      the membership, KITopen's OAI-PMH provider advertises and serves the oai_datacite metadata
      prefix, so the conformance is readable from KIT's own endpoint rather than only from a
      registry record.
    evidence:
      - url: https://api.datacite.org/providers/kit
        status: 200
        locator: 'data.id = "kit"; attributes.symbol = "KIT"; attributes.memberType = "direct_member"; attributes.rorId = "https://ror.org/04t3en479"'
      - url: https://api.datacite.org/clients/tib.kit4radar
        status: 200
        locator: 'data.attributes.name = "RADAR4KIT"; attributes.url = "https://radar.kit.edu/"'
      - url: https://dbkit.bibliothek.kit.edu/oai/?verb=ListRecords&metadataPrefix=oai_datacite
        status: 200
        locator: OAI-PMH ListRecords served for metadataPrefix oai_datacite
    generated: '2026-09-01'
    method: probed

  - standard: crossref
    status: conformant
    x-operator: institution
    detail: >-
      The KIT Library is a Crossref member in its own right and deposits DOIs under its own prefix.
      Crossref's API returns member 37766, primary-name "Karlsruhe Institute of Technology
      Library", location Karlsruhe, Germany, prefix 10.58895 and 456 deposited DOIs. KIT therefore
      mints through both DataCite (research data and repository output) and Crossref (Library
      publishing), which is unusual in this cohort and is evidenced on both registries.
    evidence:
      - url: https://api.crossref.org/members/37766
        status: 200
        locator: 'message.primary-name = "Karlsruhe Institute of Technology Library"; message.prefixes = ["10.58895"]; message.counts.total-dois = 456'
    generated: '2026-09-01'
    method: probed

not_evidenced:
  note: >-
    These are in the `education` regime standards[] and were looked for on 2026-09-01. No
    conformance is claimed for any of them. Absence here is a measurement, not an omission —
    inventing a conformance to fill a rubric slot is the specific failure this pipeline exists to
    prevent.
  standards:
    - standard: orcid
      detail: >-
        The KITopen page names ORCID in prose, but no ORCID declaration was found in any
        machine-readable document KIT serves: not in the Koha catalogue's Swagger 2.0 contract, not
        in the KI-Toolbox OpenAPI, and not in KITopen's oai_datacite records. A prose mention is not
        a contract declaration, and domain_standard_conformance reads the contract.
    - standard: lti
      detail: >-
        ILIAS runs at ilias.studium.kit.edu (HTTP 200) and ILIAS supports LTI as a product
        capability, but KIT publishes no LTI registration, platform configuration or tool contract.
        A vendor product's capability is not the institution's declared conformance.
    - standard: scim
      detail: >-
        No SCIM provisioning endpoint or contract found on any KIT-operated host. The Keycloak realm
        at oidc.scc.kit.edu exposes OIDC discovery but no SCIM surface.
    - standard: oneroster
      detail: Not found; OneRoster is a K-12 / US-centric standard with no German higher-education deployment signal.
    - standard: ed-fi
      detail: Not found; Ed-Fi is US K-12 and does not apply to a German technical university.
    - standard: caliper
      detail: No Caliper analytics endpoint or declaration found on ILIAS or any other KIT host.
    - standard: qti
      detail: No QTI assessment interchange surface published.
