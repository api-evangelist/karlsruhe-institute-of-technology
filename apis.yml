description: >-
  Karlsruhe Institute of Technology (KIT) is a public research university and national research
  center of the Helmholtz Association in Karlsruhe, Germany, and a member of the TU9 alliance of
  German institutes of technology. KIT publishes no central developer portal and no
  institution-authored API contract: api.kit.edu, developer.kit.edu, data.kit.edu and
  opendata.kit.edu do not resolve at all. What it does operate, and what this profile records, is a
  set of standards-protocol and self-hosted surfaces on its own kit.edu domain, every one of them
  probed live on 2026-09-01 rather than taken from a link. The KIT Library runs an OAI-PMH 2.0
  provider for the KITopen institutional repository (repositoryName "KITopen", built on the
  Library's own dbkit framework) and a self-hosted Koha catalogue whose REST API answers keyless on
  its /public path. The Scientific Computing Center runs a Shibboleth SAML 2.0 Identity Provider
  registered in the DFN-AAI federation, a Keycloak OpenID Connect realm, and the KI-Toolbox, an
  Open WebUI deployment serving locally hosted large language models. RADAR4KIT, KIT's
  research-data repository, is a tenancy on FIZ Karlsruhe's RADAR service running on KIT
  infrastructure. KIT is a DataCite direct member and a Crossref member in its own right. Three of
  these surfaces answer with a product's generic contract (Koha, RADAR, Open WebUI) rather than
  KIT's own engineering; the deployments are recorded here and those contracts are deliberately not
  saved under KIT's name.
