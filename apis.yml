x-coverage:
  state: covered
  reason: covered
  detail: >-
    Re-profiled 2026-09-01 under the university pipeline, with every surface probed rather than
    inferred from a link. The audit found no vendor-attributed OpenAPI in this repository and
    nothing had to be removed for misattribution — this repo was never contaminated by the Figshare
    /Pure pattern, because it never held a saved contract at all. What the re-profile changed is
    the opposite problem: the June 2026 entry set claimed a "dbkit API" with no baseURL, no
    documented endpoint and no evidenced public contract, and its RADAR4KIT documentation pointer
    was dead. Six institution-operated or institution-registered surfaces were found, verified and
    added or corrected. The headline finding is an operator finding: KIT operates a real, live,
    partly keyless machine surface — but almost none of the contracts behind it are KIT's. The KIT
    Library's Koha catalogue serves a 242-path Swagger 2.0 document from katalog.bibliothek.kit.edu
    whose info.contact is the Koha Development Team; the KI-Toolbox serves a 458-path OpenAPI 3.1.0
    document from ki-toolbox.scc.kit.edu whose info.title is "Open WebUI" and which declares no
    servers[] at all; RADAR4KIT runs FIZ Karlsruhe's RADAR contract on KIT infrastructure. All
    three deployments are recorded and all three contracts are deliberately unsaved. The one
    surface that is unambiguously KIT's own engineering is the KITopen OAI-PMH 2.0 provider on
    dbkit, the framework the KIT Library wrote itself. Identity is the strongest institution-owned
    axis: a Shibboleth SAML 2.0 IdP registered in DFN-AAI since 2010 and a Keycloak OIDC realm,
    both on kit.edu, both previously uncatalogued in the OIDC case. KIT is additionally a DataCite
    direct member and a Crossref member. What KIT does NOT publish is measured just as carefully:
    api.kit.edu, developer.kit.edu, data.kit.edu and opendata.kit.edu do not resolve, there is no
    developer portal, no open data portal, no llms.txt and no sitemap.xml at the apex, no
    institution-authored OpenAPI anywhere, and no LTI, SCIM, OneRoster, Ed-Fi, Caliper or QTI
    surface despite running ILIAS and CAS Campus. ORCID is named in KITopen prose but is not
    declared in any contract KIT serves, so no ORCID conformance is claimed. One apis[] entry was
    removed as unevidenced and one dead documentation pointer was replaced.
